# SPDX-License-Identifier: MPL-2.0
[package]
name = "prism"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Safe, idiomatic Rust bindings for Prism, the Platform-agnostic Reader Interface for Speech and Messages."
readme = "README.md"

[dependencies]
prism-sys = { workspace = true }
prism-types = { workspace = true }
libc = { workspace = true }

[features]
default = []
# Forward the FFI regeneration feature to prism-sys.
bindgen = ["prism-sys/bindgen"]

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
