# Authoritative pin for the vendored upstream Prism library.
#
# This file is the single source of truth that humans and the maintenance
# skills read. It MUST agree with:
#   * the gitlink recorded in the superproject (`git submodule status`)
#   * the comment header in .gitmodules
#
# Only the `update-prism` skill should edit this file. It always selects a
# *stable* release tag (never a moving branch) so every clone is identical.

[prism]
repository = "https://github.com/ethindp/prism"
# Stable release tag that is checked out in external/prism.
tag = "v0.17.3"
# Fully-resolved commit the tag points at. Reproducibility comes from this SHA.
commit = "9911156998b52fee91fb2cb4f71ac793d4e546c7"
# Upstream license (SPDX). Governs the vendored source and the generated FFI.
license = "MPL-2.0"
