[workspace]
resolver = "2"
members = [
    "crates/prism-types",
    "crates/prism-sys",
    "crates/prism",
]

[workspace.package]
version = "0.18.1"
edition = "2021"
rust-version = "1.82"
license = "MPL-2.0"
repository = "https://github.com/ethindp/prism"
authors = ["prism2rust contributors"]
description = "Rust bindings for Prism, the Platform-agnostic Reader Interface for Speech and Messages"

# The crate versions intentionally track the pinned upstream Prism release
# (see PRISM_PIN.toml). The `update-prism` skill bumps both together.

[workspace.dependencies]
# --- internal ---
prism-types = { path = "crates/prism-types", version = "0.18.1" }
prism-sys = { path = "crates/prism-sys", version = "0.18.1" }

# --- external (versions & licenses verified 2026-07-11) ---
bitflags = "2.13.0"    # MIT OR Apache-2.0
thiserror = "2.0.18"   # MIT OR Apache-2.0
libc = "0.2.186"       # MIT OR Apache-2.0
bindgen = "0.72.1"     # BSD-3-Clause (build-dependency of prism-sys only)
cmake = "0.1.58"       # MIT OR Apache-2.0 (build-dependency of prism-sys only)

[profile.release]
lto = "thin"
