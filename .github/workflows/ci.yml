# CI for prism2rust.
#
# Four tiers:
#   * quick   — format, lint, docs, and the pure-Rust `prism-types` tests.
#               No C++ toolchain required (native build is skipped).
#   * native  — build the vendored Prism (C++23) via CMake on Linux/macOS/Windows
#               and run the full integration test suite against it.
#   * static  — the same suite against a *statically* linked Prism on each
#               desktop platform; a materially different link path per platform
#               (see prism-sys/README).
#   * msrv    — verify the crate still type-checks on the declared minimum Rust.
#
# Action versions are pinned and kept current by Dependabot (.github/dependabot.yml):
#   actions/checkout        v7.0.0        (MIT)
#   dtolnay/rust-toolchain  @stable       (MIT)
#   Swatinem/rust-cache     v2.9.1        (LGPL-3.0-only; CI tool, not linked)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quick:
    name: format · lint · unit tests
    runs-on: ubuntu-latest
    env:
      # The pure-Rust logic and lints do not need the native library.
      PRISM_SYS_NO_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        # No submodules needed: this tier never builds the native library.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - name: pin consistency
        run: bash scripts/check-pin.sh
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: unit tests (prism-types)
        run: cargo test -p prism-types --all-features
      - name: doc build
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  native:
    name: native build & integration tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        # CMake ships preinstalled on all GitHub-hosted runners; the `cmake`
        # build-dependency finds it on PATH.
      - name: Select a C++23 compiler + a Linux backend
        if: runner.os == 'Linux'
        # libspeechd-dev (speech-dispatcher, GPL-2.0-or-later; a build/runtime
        # dependency of the vendored C library, not linked into the Rust crates)
        # enables Prism's speech_dispatcher backend. Since v0.17.3 upstream's
        # CMake fails outright when no backend is enabled, and a bare runner has
        # none. The daemon is absent, so the backend reports itself unavailable
        # at runtime — the integration tests drive a CustomBackend anyway.
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libspeechd-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Build workspace + examples (builds vendored Prism via CMake)
        run: cargo build --workspace --examples --verbose
      - name: Run tests
        run: cargo test --workspace --verbose
      - name: Run portable example
        # The custom-backend example needs no real screen reader, so it runs
        # anywhere. (The `speak` example is built above but not run — it needs a
        # live backend that headless runners lack.)
        run: cargo run -p prism --example custom_backend

  static:
    name: static link (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libspeechd-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Build + test against a statically linked Prism
        # PRISM_STATIC exercises a different link path entirely. Everything
        # upstream links PRIVATE to `prism` has to be replayed at the final
        # link, and how differs per platform: import libraries and delay-loaded
        # screen-reader DLLs on windows-msvc, pkg-config modules on Linux,
        # frameworks on Apple. The archive is also pulled in whole so the
        # built-in backend registrars survive. See crates/prism-sys/README.md.
        env:
          PRISM_STATIC: "1"
        run: |
          cargo test --workspace --verbose
          cargo run -p prism --example custom_backend

  msrv:
    name: MSRV (1.82)
    runs-on: ubuntu-latest
    env:
      PRISM_SYS_NO_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo check on MSRV
        run: cargo check --workspace --all-targets
